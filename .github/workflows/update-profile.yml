name: refresh profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: regenerate assets
        run: python update.py
      - name: commit changes
        run: |
          git config user.name "keelbismark-bot"
          git config user.email "contact@keelbismark.space"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile data [skip ci]"
          git push