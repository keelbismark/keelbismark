<svg width="900" height="150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats">
<title>GitHub stats</title>
<defs>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .accent { fill: #ff2e88; }
  .white { fill: #f5f0f4; }
  .text { fill: #d4c8d1; }
  .muted { fill: #93838f; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .chip { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.10; }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22,.9,.3,1.05) forwards; }
  .fadeup { opacity: 0; animation: fadeup .5s cubic-bezier(.22,.9,.3,1.05) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .rise, .fadeup { animation: none; opacity: 1; } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16111b"/><stop offset="1" stop-color="#0d0a11"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1c1522"/><stop offset="1" stop-color="#141018"/>
</linearGradient>
<linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#ff7ab8"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.02"/>
</pattern>
<radialGradient id="glowTL" cx="0.15" cy="0" r="0.8">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="0.05"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
  <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
</filter>
</defs>
<rect x="0" y="0" width="900" height="150" rx="24" fill="#08060b"/>
<rect x="0" y="0" width="900" height="150" rx="24" fill="url(#grid)"/>
<rect x="0" y="0" width="900" height="150" rx="24" fill="url(#glowTL)"/>
<rect x="0.5" y="0.5" width="899" height="149" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
<g class="rise">
  <rect class="card-bg" x="20" y="20" width="860" height="110" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="20.5" y="20.5" width="859" height="109" rx="20"/>
  <path d="M20 40 a20 20 0 0 1 20 -20 h820 a20 20 0 0 1 20 20 v10 h-860 z" fill="url(#headGrad)"/>
  <circle fill="#ff5f56" cx="40" cy="35" r="4"/>
  <circle fill="#ffbd2e" cx="56" cy="35" r="4"/>
  <circle fill="#27c93f" cx="72" cy="35" r="4"/>
  <text class="mono muted" x="450" y="39" font-size="10" text-anchor="middle"><tspan class="accent">//</tspan> stats</text>
  <text class="sans white" x="128" y="92" font-size="22" font-weight="700" text-anchor="middle">16</text>
  <text class="sans muted" x="128" y="112" font-size="9" text-anchor="middle">public repos</text>
  <text class="sans white" x="292" y="92" font-size="22" font-weight="700" text-anchor="middle">8</text>
  <text class="sans muted" x="292" y="112" font-size="9" text-anchor="middle">stars</text>
  <line x1="210" y1="64" x2="210" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>
  <text class="sans white" x="456" y="92" font-size="22" font-weight="700" text-anchor="middle">8</text>
  <text class="sans muted" x="456" y="112" font-size="9" text-anchor="middle">forks</text>
  <line x1="374" y1="64" x2="374" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>
  <text class="sans white" x="620" y="92" font-size="22" font-weight="700" text-anchor="middle">2</text>
  <text class="sans muted" x="620" y="112" font-size="9" text-anchor="middle">followers</text>
  <line x1="538" y1="64" x2="538" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>
  <text class="sans white" x="784" y="92" font-size="22" font-weight="700" text-anchor="middle">since 2022</text>
  <text class="sans muted" x="784" y="112" font-size="9" text-anchor="middle">on github</text>
  <line x1="702" y1="64" x2="702" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>
</g>
</svg>
