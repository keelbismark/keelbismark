<svg width="100%" height="auto" viewBox="0 0 960 115" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Stats Telemetry">
<title>GitHub Stats Telemetry</title>
<defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .text-primary { fill: #f8fafc; }
  .text-secondary { fill: #94a3b8; }
  .text-muted { fill: #64748b; }
  .accent { fill: #ff2e88; }
</style>
<linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0b0f17"/>
  <stop offset="100%" stop-color="#111827"/>
</linearGradient>
</defs>

<!-- Protective self-contained canvas -->
<rect x="2" y="2" width="956" height="111" rx="14" fill="url(#canvas)" stroke="#334155"/>

<!-- Header info -->
<g class="sans">
  <text x="24" y="26" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.5">REPOSITORY METRICS</text>
  <text x="936" y="26" fill="#64748b" font-size="10" text-anchor="end">VERIFIED DATA</text>
  <line x1="24" y1="36" x2="936" y2="36" stroke="#1e293b" stroke-width="1"/>
</g>

<!-- Content -->
  <text class="sans" x="115.2" y="68" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">14</text>
  <text class="sans" x="115.2" y="88" fill="#94a3b8" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">PUBLIC REPOSITORIES</text>
  <text class="sans" x="297.6" y="68" fill="#ff2e88" font-size="22" font-weight="700" text-anchor="middle">12</text>
  <text class="sans" x="297.6" y="88" fill="#94a3b8" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">TOTAL STARS EARNED</text>
  <line x1="206.4" y1="48" x2="206.4" y2="94" stroke="#1e293b" stroke-width="1"/>
  <text class="sans" x="480.0" y="68" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">7</text>
  <text class="sans" x="480.0" y="88" fill="#94a3b8" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">COMMUNITY FORKS</text>
  <line x1="388.8" y1="48" x2="388.8" y2="94" stroke="#1e293b" stroke-width="1"/>
  <text class="sans" x="662.4" y="68" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">3</text>
  <text class="sans" x="662.4" y="88" fill="#94a3b8" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">FOLLOWERS</text>
  <line x1="571.2" y1="48" x2="571.2" y2="94" stroke="#1e293b" stroke-width="1"/>
  <text class="sans" x="844.8" y="68" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">2022</text>
  <text class="sans" x="844.8" y="88" fill="#94a3b8" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">ACTIVE SINCE</text>
  <line x1="753.6" y1="48" x2="753.6" y2="94" stroke="#1e293b" stroke-width="1"/>
</svg>
