<svg width="100%" height="auto" viewBox="0 0 960 115" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language Telemetry">
<title>Language Telemetry</title>
<defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .text-primary { fill: #f8fafc; }
  .text-secondary { fill: #94a3b8; }
  .text-muted { fill: #64748b; }
  .accent { fill: #ff2e88; }
</style>
<linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0b0f17"/>
  <stop offset="100%" stop-color="#111827"/>
</linearGradient>
</defs>

<!-- Protective self-contained canvas -->
<rect x="2" y="2" width="956" height="111" rx="14" fill="url(#canvas)" stroke="#334155"/>

<!-- Header info -->
<g class="sans">
  <text x="24" y="26" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.5">LANGUAGE DISTRIBUTION</text>
  <text x="936" y="26" fill="#64748b" font-size="10" text-anchor="end">CODEBASE BY BYTES</text>
  <line x1="24" y1="36" x2="936" y2="36" stroke="#1e293b" stroke-width="1"/>
</g>

<!-- Content -->
  <rect x="24.0" y="50.0" width="912.0" height="10.0" rx="4" fill="#1e293b"/>
  <rect x="24.0" y="50.0" width="492.5" height="10.0" rx="2" fill="#dea584"><title>Rust: 54.0%</title></rect>
  <rect x="516.5" y="50.0" width="187.9" height="10.0" rx="2" fill="#b07219"><title>Java: 20.6%</title></rect>
  <rect x="704.4" y="50.0" width="66.6" height="10.0" rx="2" fill="#f1e05a"><title>JavaScript: 7.3%</title></rect>
  <rect x="770.9" y="50.0" width="33.7" height="10.0" rx="2" fill="#89e051"><title>Shell: 3.7%</title></rect>
  <rect x="804.7" y="50.0" width="32.8" height="10.0" rx="2" fill="#ff2e88"><title>PowerShell: 3.6%</title></rect>
  <rect x="837.5" y="50.0" width="31.9" height="10.0" rx="2" fill="#e34c26"><title>HTML: 3.5%</title></rect>
  <g transform="translate(24.0, 86.0)">
    <circle cx="4" cy="4" r="3.5" fill="#dea584"/>
    <text class="sans" x="14" y="7" fill="#f8fafc" font-size="11" font-weight="500">Rust</text>
    <text class="mono" x="80" y="7" fill="#64748b" font-size="10.5">54.0%</text>
  </g>
  <g transform="translate(174.0, 86.0)">
    <circle cx="4" cy="4" r="3.5" fill="#b07219"/>
    <text class="sans" x="14" y="7" fill="#f8fafc" font-size="11" font-weight="500">Java</text>
    <text class="mono" x="80" y="7" fill="#64748b" font-size="10.5">20.6%</text>
  </g>
  <g transform="translate(324.0, 86.0)">
    <circle cx="4" cy="4" r="3.5" fill="#f1e05a"/>
    <text class="sans" x="14" y="7" fill="#f8fafc" font-size="11" font-weight="500">JavaScript</text>
    <text class="mono" x="80" y="7" fill="#64748b" font-size="10.5">7.3%</text>
  </g>
  <g transform="translate(474.0, 86.0)">
    <circle cx="4" cy="4" r="3.5" fill="#89e051"/>
    <text class="sans" x="14" y="7" fill="#f8fafc" font-size="11" font-weight="500">Shell</text>
