<svg width="900" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Languages">
<title>Languages</title>
<defs>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #6b5a68; letter-spacing: 2px; }
  .accent { fill: #ff2e88; }
  .white { fill: #f5f0f4; }
  .text { fill: #d4c8d1; }
  .muted { fill: #93838f; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22,.9,.3,1.05) forwards; }
  .fadeup { opacity: 0; animation: fadeup .5s cubic-bezier(.22,.9,.3,1.05) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .rise, .fadeup { animation: none; opacity: 1; } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16111b"/><stop offset="1" stop-color="#0d0a11"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
</linearGradient>
<linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#ff7ab8"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.02"/>
</pattern>
<radialGradient id="glowTL" cx="0.15" cy="0" r="0.8">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="0.05"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
  <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
</filter>
</defs>
<rect x="0" y="0" width="900" height="260" rx="24" fill="#08060b"/>
<rect x="0" y="0" width="900" height="260" rx="24" fill="url(#grid)"/>
<rect x="0" y="0" width="900" height="260" rx="24" fill="url(#glowTL)"/>
<rect x="0.5" y="0.5" width="899" height="259" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
<g class="rise">
  <rect class="card-bg" x="20" y="20" width="860" height="220" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="20.5" y="20.5" width="859" height="219" rx="20"/>
  <text class="label" x="44" y="62"><tspan class="accent">//</tspan> languages — real repo data</text>
  <g class="fadeup" style="animation-delay:0.2s">
    <text class="sans text" x="44" y="97" font-size="11">Java</text>
    <rect x="170" y="88" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="88" width="156" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="97" font-size="10" text-anchor="end">27.9%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.3s">
    <text class="sans text" x="44" y="123" font-size="11">JavaScript</text>
    <rect x="170" y="114" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="114" width="148" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="123" font-size="10" text-anchor="end">26.4%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.4s">
    <text class="sans text" x="44" y="149" font-size="11">HTML</text>
    <rect x="170" y="140" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="140" width="104" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="149" font-size="10" text-anchor="end">18.6%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.5s">
    <text class="sans text" x="44" y="175" font-size="11">Python</text>
    <rect x="170" y="166" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="166" width="92" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="175" font-size="10" text-anchor="end">16.4%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.6s">
    <text class="sans text" x="44" y="201" font-size="11">CSS</text>
    <rect x="170" y="192" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="192" width="43" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="201" font-size="10" text-anchor="end">7.7%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.7s">
    <text class="sans text" x="44" y="227" font-size="11">PowerShell</text>
    <rect x="170" y="218" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="218" width="11" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="227" font-size="10" text-anchor="end">1.9%</text>
  </g>
</g>
</svg>
