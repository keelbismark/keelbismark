<svg width="900" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Languages">
<title>Languages</title>
<defs>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .accent { fill: #ff2e88; }
  .white { fill: #f5f0f4; }
  .text { fill: #d4c8d1; }
  .muted { fill: #93838f; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .chip { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.10; }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22,.9,.3,1.05) forwards; }
  .fadeup { opacity: 0; animation: fadeup .5s cubic-bezier(.22,.9,.3,1.05) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .rise, .fadeup { animation: none; opacity: 1; } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16111b"/><stop offset="1" stop-color="#0d0a11"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1c1522"/><stop offset="1" stop-color="#141018"/>
</linearGradient>
<linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#ff7ab8"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.02"/>
</pattern>
<radialGradient id="glowTL" cx="0.15" cy="0" r="0.8">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="0.05"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
  <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
</filter>
</defs>
<rect x="0" y="0" width="900" height="260" rx="24" fill="#08060b"/>
<rect x="0" y="0" width="900" height="260" rx="24" fill="url(#grid)"/>
<rect x="0" y="0" width="900" height="260" rx="24" fill="url(#glowTL)"/>
<rect x="0.5" y="0.5" width="899" height="259" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
<g class="rise">
  <rect class="card-bg" x="20" y="20" width="860" height="220" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="20.5" y="20.5" width="859" height="219" rx="20"/>
  <path d="M20 40 a20 20 0 0 1 20 -20 h820 a20 20 0 0 1 20 20 v10 h-860 z" fill="url(#headGrad)"/>
  <circle fill="#ff5f56" cx="40" cy="35" r="4"/>
  <circle fill="#ffbd2e" cx="56" cy="35" r="4"/>
  <circle fill="#27c93f" cx="72" cy="35" r="4"/>
  <text class="mono muted" x="450" y="39" font-size="10" text-anchor="middle"><tspan class="accent">//</tspan> languages — real repo data</text>
  <g class="fadeup" style="animation-delay:0.2s">
    <text class="sans text" x="44" y="87" font-size="11">Java</text>
    <rect x="170" y="78" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="78" width="156" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="87" font-size="10" text-anchor="end">27.9%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.3s">
    <text class="sans text" x="44" y="113" font-size="11">JavaScript</text>
    <rect x="170" y="104" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="104" width="148" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="113" font-size="10" text-anchor="end">26.5%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.4s">
    <text class="sans text" x="44" y="139" font-size="11">HTML</text>
    <rect x="170" y="130" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="130" width="104" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="139" font-size="10" text-anchor="end">18.6%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.5s">
    <text class="sans text" x="44" y="165" font-size="11">Python</text>
    <rect x="170" y="156" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="156" width="91" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="165" font-size="10" text-anchor="end">16.3%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.6s">
    <text class="sans text" x="44" y="191" font-size="11">CSS</text>
    <rect x="170" y="182" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="182" width="43" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="191" font-size="10" text-anchor="end">7.7%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.7s">
    <text class="sans text" x="44" y="217" font-size="11">PowerShell</text>
    <rect x="170" y="208" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="170" y="208" width="11" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono muted" x="856" y="217" font-size="10" text-anchor="end">1.9%</text>
  </g>
</g>
</svg>
