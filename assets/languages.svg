<svg width="100%" height="auto" viewBox="0 0 900 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language Metrics" preserveAspectRatio="xMidYMid meet">
<title>Language Metrics</title>
<defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
  .accent { fill: #ff2e88; }
  .white { fill: #f8fafc; }
  .text { fill: #cbd5e1; }
  .muted { fill: #64748b; }
  .faint { fill: #475569; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .chip { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.08; }
  .rise { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .fadeup { opacity: 0; animation: fadeup 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .rise, .fadeup { animation: none; opacity: 1; transform: none; } .pulse { animation: none; } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#120e17"/>
  <stop offset="100%" stop-color="#09070d"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
</linearGradient>
<linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#ff2e88" stop-opacity="0.0"/>
</linearGradient>
<linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff2e88"/>
  <stop offset="100%" stop-color="#ff007f"/>
</linearGradient>
<pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
</pattern>
<radialGradient id="ambientGlow" cx="0.1" cy="0.1" r="0.7">
  <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.06"/>
  <stop offset="100%" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
  <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
</filter>
<filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff2e88" flood-opacity="0.55"/>
</filter>
</defs>
<rect x="0" y="0" width="900" height="256" rx="20" fill="#07050a"/>
<rect x="0" y="0" width="900" height="256" rx="20" fill="url(#dotGrid)"/>
<rect x="0" y="0" width="900" height="256" rx="20" fill="url(#ambientGlow)"/>
<rect x="0.5" y="0.5" width="899" height="255" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
<g class="rise">
  <rect class="card-bg" x="20" y="16" width="860" height="224" rx="16" filter="url(#shadowDepth)"/>
  <rect class="edge" x="20.5" y="16.5" width="859" height="223" rx="15.5"/>
  <rect x="21" y="17" width="858" height="32" rx="15" fill="url(#headerGrad)"/>
  <text class="mono faint" x="38" y="38" font-size="10" font-weight="600" letter-spacing="1"><tspan class="accent">//</tspan> REPO.ANALYTICS [DISTRIBUTION_PERCENTILE]</text>
  <circle cx="862" cy="33" r="3" fill="#10b981" class="pulse"/>
  <text class="mono faint" x="852" y="36" font-size="9" text-anchor="end">LIVE TELEMETRY</text>
  <g class="fadeup" style="animation-delay:0.15s">
    <text class="mono text" x="42" y="83" font-size="11" font-weight="500">Rust</text>
    <rect x="170" y="74" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="74" width="302" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="83" font-size="10" font-weight="700" text-anchor="end">54.0%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.23s">
    <text class="mono text" x="42" y="109" font-size="11" font-weight="500">Java</text>
    <rect x="170" y="100" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="100" width="115" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="109" font-size="10" font-weight="700" text-anchor="end">20.6%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.31s">
    <text class="mono text" x="42" y="135" font-size="11" font-weight="500">JavaScript</text>
    <rect x="170" y="126" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="126" width="41" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="135" font-size="10" font-weight="700" text-anchor="end">7.3%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.39s">
    <text class="mono text" x="42" y="161" font-size="11" font-weight="500">Shell</text>
    <rect x="170" y="152" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="152" width="21" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="161" font-size="10" font-weight="700" text-anchor="end">3.7%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.47s">
    <text class="mono text" x="42" y="187" font-size="11" font-weight="500">PowerShell</text>
    <rect x="170" y="178" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="178" width="20" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="187" font-size="10" font-weight="700" text-anchor="end">3.6%</text>
  </g>
  <g class="fadeup" style="animation-delay:0.55s">
    <text class="mono text" x="42" y="213" font-size="11" font-weight="500">HTML</text>
    <rect x="170" y="204" width="560" height="10" rx="5" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="170" y="204" width="20" height="10" rx="5" fill="url(#barGrad)"/>
    <text class="mono faint" x="858" y="213" font-size="10" font-weight="700" text-anchor="end">3.5%</text>
  </g>
</g>
</svg>
