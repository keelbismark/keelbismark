<svg width="900" height="494" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KeelBismarck — full-stack developer profile">
<title>KeelBismarck — full-stack developer</title>
<defs>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #6b5a68; letter-spacing: 2px; }
  .accent { fill: #ff2e88; }
  .white { fill: #f5f0f4; }
  .text { fill: #d4c8d1; }
  .muted { fill: #93838f; }
  .green { fill: #3fb950; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .chip { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.10; }
  .core { fill: #ff2e88; fill-opacity: 0.08; stroke: #ff2e88; stroke-opacity: 0.35; animation: coreGlow 3s ease-in-out 1.4s infinite; }
  .core-t { fill: #ffd7e8; }
  .icon { fill: none; stroke: #ff9ec7; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .icon * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawI .8s ease-out forwards; }
  .ig1 * { animation-delay: .6s; } .ig2 * { animation-delay: .75s; }
  .ig3 * { animation-delay: .9s; } .ig4 * { animation-delay: 1.05s; }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22,.9,.3,1.05) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
  .fadeup { opacity: 0; animation: fadeup .5s cubic-bezier(.22,.9,.3,1.05) forwards; }
  .r1 { animation-delay: .5s; } .r2 { animation-delay: .62s; } .r3 { animation-delay: .74s; } .r4 { animation-delay: .86s; }
  .fade { opacity: 0; animation: fade .4s ease-out forwards; }
  .f1 { animation-delay: 1.7s; } .f2 { animation-delay: 3.2s; } .f3 { animation-delay: 3.5s; }
  .t1 { width: 0; animation: t1 .7s steps(6) .9s forwards; }
  .t2 { width: 0; animation: t2 .9s steps(14) 2.2s forwards; }
  .cA { opacity: 0; animation: cA 2.5s linear forwards; }
  .cB { opacity: 0; animation: cB 4s linear forwards; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .blink { animation: blink 1s step-end infinite; }
  .draw1 { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .7s ease-out 1s forwards; }
  .draw2 { stroke-dasharray: 85; stroke-dashoffset: 85; animation: draw .7s ease-out 1.15s forwards; }
  .ambient { animation: amb 8s ease-in-out infinite alternate; }
  .sticker { transform-origin: 500px 44px; animation: pop .6s cubic-bezier(.3,1.4,.4,1) .7s both, floaty 5s ease-in-out 1.6s infinite alternate; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes t1 { to { width: 48px; } }
  @keyframes t2 { to { width: 86px; } }
  @keyframes cA { 0% { opacity: 0; transform: translateX(0); } 36% { opacity: 1; transform: translateX(0); } 64% { opacity: 1; transform: translateX(48px); } 68%, 100% { opacity: 0; transform: translateX(48px); } }
  @keyframes cB { 0% { opacity: 0; transform: translateX(0); } 55% { opacity: 1; transform: translateX(0); } 77.5% { opacity: 1; transform: translateX(86px); } 81%, 100% { opacity: 0; transform: translateX(86px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes drawI { to { stroke-dashoffset: 0; } }
  @keyframes coreGlow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .65; } }
  @keyframes amb { from { opacity: .7; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: rotate(-5deg) scale(.7); } 100% { opacity: 1; transform: rotate(-5deg) scale(1); } }
  @keyframes floaty { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(-5deg) translateY(-3px); } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16111b"/><stop offset="1" stop-color="#0d0a11"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1c1522"/><stop offset="1" stop-color="#141018"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc3d8"/>
</linearGradient>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="1"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0.25"/>
</linearGradient>
<radialGradient id="glowTL" cx="0.15" cy="0" r="0.8">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="0.07"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowBR" cx="0.9" cy="1" r="0.8">
  <stop offset="0" stop-color="#ff2e88" stop-opacity="0.04"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.02"/>
</pattern>
<filter id="glowP" x="-80%" y="-80%" width="260%" height="260%">
  <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff2e88" flood-opacity="0.45"/>
</filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
  <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
</filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="tc1"><rect class="t1" x="616" y="65" width="0" height="18"/></clipPath>
<clipPath id="tc2"><rect class="t2" x="616" y="117" width="0" height="18"/></clipPath>
</defs>

<!-- panel -->
<rect x="0" y="0" width="900" height="494" rx="24" fill="#08060b"/>
<rect x="0" y="0" width="900" height="494" rx="24" fill="url(#grid)"/>
<rect class="ambient" x="0" y="0" width="900" height="494" rx="24" fill="url(#glowTL)"/>
<rect x="0" y="0" width="900" height="494" rx="24" fill="url(#glowBR)"/>
<rect x="0" y="0" width="900" height="494" rx="24" filter="url(#noise)" opacity="0.02"/>
<rect x="0.5" y="0.5" width="899" height="493" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

<!-- ═══ IDENTITY ═══ -->
<g class="rise d1">
  <rect class="card-bg" x="20" y="20" width="540" height="210" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="20.5" y="20.5" width="539" height="209" rx="20"/>
  <!-- logo: ring + prompt glyph + orbit -->
  <circle cx="76" cy="96" r="30" fill="#0d0a11" stroke="url(#ringGrad)" stroke-width="1.5"/>
  <text class="mono accent" x="70" y="103" font-size="18" font-weight="700" text-anchor="middle">❯</text>
  <rect class="blink" x="79" y="98" width="9" height="2.5" rx="1" fill="#ff9ec7"/>
  <g>
    <circle cx="76" cy="66" r="2.5" fill="#ff9ec7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 76 96" to="360 76 96" dur="10s" repeatCount="indefinite"/>
  </g>
  <text class="sans" x="128" y="88" font-size="34" font-weight="700" letter-spacing="-0.5" fill="url(#nameGrad)">KeelBismarck</text>
  <path class="draw1" d="M128 100 q14 4 28 1 t28 0 t28 -1" fill="none" stroke="#ff2e88" stroke-width="2.5" stroke-linecap="round" filter="url(#glowP)"/>
  <path class="draw2" d="M130 103 q14 3 26 1 t26 0 t24 -1" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <text class="sans muted" x="128" y="128" font-size="13">Full-stack Developer · Python / JavaScript / C++</text>
  <rect x="128" y="146" width="168" height="28" rx="14" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.35"/>
  <circle class="green pulse" cx="146" cy="160" r="4"/>
  <circle cx="146" cy="160" r="4" fill="none" stroke="#3fb950" stroke-width="1">
    <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text class="sans" x="158" y="165" font-size="12" fill="#7ee2a8">Open for freelance</text>
  <rect x="308" y="146" width="148" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <text class="sans muted" x="324" y="165" font-size="12">Moscow · UTC+3</text>
  <g class="sticker">
    <rect x="448" y="29" width="104" height="30" rx="15" fill="#ff2e88" filter="url(#shadow)"/>
    <text class="mono" x="500" y="48" font-size="11" font-weight="700" text-anchor="middle" fill="#200510">hire me →</text>
  </g>
</g>

<!-- ═══ TERMINAL ═══ -->
<g class="rise d2">
  <rect class="card-bg" x="580" y="20" width="300" height="210" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="580.5" y="20.5" width="299" height="209" rx="20"/>
  <path d="M580 40 a20 20 0 0 1 20 -20 h260 a20 20 0 0 1 20 20 v10 h-300 z" fill="url(#headGrad)"/>
  <circle fill="#ff5f56" cx="600" cy="35" r="4"/>
  <circle fill="#ffbd2e" cx="616" cy="35" r="4"/>
  <circle fill="#27c93f" cx="632" cy="35" r="4"/>
  <text class="mono muted" x="730" y="39" font-size="10" text-anchor="middle">zsh — keelbismark</text>
  <g class="mono" font-size="11">
    <text class="accent" x="598" y="78">❯</text>
    <text class="white" x="616" y="78" clip-path="url(#tc1)">whoami</text>
    <rect class="cA accent" x="616" y="66" width="7" height="14"/>
    <text class="sans white fade f1" x="616" y="102" font-size="12" font-weight="700">KeelBismarck</text>
    <text class="accent fade f1" x="598" y="132">❯</text>
    <text class="white" x="616" y="132" clip-path="url(#tc2)">cat status.txt</text>
    <rect class="cB accent" x="616" y="120" width="7" height="14"/>
    <text class="text fade f2" x="616" y="156">focused · available</text>
    <g class="fade f3">
      <text class="accent" x="598" y="186">❯</text>
      <rect class="accent blink" x="616" y="175" width="7" height="14"/>
    </g>
  </g>
</g>

