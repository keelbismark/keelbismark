<!-- ═══ CONTACT ═══ -->
<g class="rise d4">
  <rect class="card-bg" x="580" y="244" width="300" height="230" rx="20" filter="url(#shadow)"/>
  <rect class="edge" x="580.5" y="244.5" width="299" height="229" rx="20"/>
  <text class="label" x="604" y="278"><tspan class="accent">//</tspan> contact</text>
  <circle cx="614" cy="302" r="11" fill="#ffffff" fill-opacity="0.05"/>
  <g class="icon ig1" transform="translate(608,296)">
    <path pathLength="1" d="M11 1 L1 5.8 L4.8 7.2 L5.6 11 L7.6 8.6 L11 1 Z"/><path pathLength="1" d="M11 1 L4.8 7.2"/>
  </g>
  <circle cx="614" cy="338" r="11" fill="#ffffff" fill-opacity="0.05"/>
  <g class="icon ig2" transform="translate(608,332)">
    <path pathLength="1" d="M1.5 1.5 h9 a1 1 0 0 1 1 1 v5 a1 1 0 0 1 -1 1 H6 l-2.8 2.4 V8.5 H1.5 a1 1 0 0 1 -1 -1 v-5 a1 1 0 0 1 1 -1 z"/>
