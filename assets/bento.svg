<svg width="100%" height="auto" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KeelBismarck — Systems &amp; High-Load Engineer" preserveAspectRatio="xMidYMid meet">
<title>KeelBismarck — Systems &amp; High-Load Engineer</title>
<defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
  .accent { fill: #ff2e88; }
  .accent-stroke { stroke: #ff2e88; }
  .white { fill: #f8fafc; }
  .text { fill: #cbd5e1; }
  .muted { fill: #64748b; }
  .faint { fill: #475569; }
  .card-bg { fill: url(#cardGrad); }
  .edge { fill: none; stroke: url(#edgeGrad); }
  .chip { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.08; }
  .chip-core { fill: #ff2e88; fill-opacity: 0.09; stroke: #ff2e88; stroke-opacity: 0.38; }
  .chip-core-t { fill: #ffd2e5; font-weight: 600; }
  .tag-label { fill: #94a3b8; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
  
  /* Animations */
  .rise { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .d1 { animation-delay: 0.05s; }
  .d2 { animation-delay: 0.15s; }
  .d3 { animation-delay: 0.25s; }
  .d4 { animation-delay: 0.35s; }
  
  .fadeup { opacity: 0; animation: fadeup 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .r1 { animation-delay: 0.45s; }
  .r2 { animation-delay: 0.55s; }
  .r3 { animation-delay: 0.65s; }
  .r4 { animation-delay: 0.75s; }
  
  .radar-ring { transform-origin: 75px 95px; animation: spin 12s linear infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .blink { animation: blink 1.2s step-end infinite; }
  .glow-line { stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawLine 1.8s ease-out 0.8s forwards; }
  .telemetry-sweep { animation: sweep 3s ease-in-out infinite alternate; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }
  @keyframes sweep { from { opacity: 0.3; } to { opacity: 0.8; } }

  @media (prefers-reduced-motion: reduce) {
    .rise, .fadeup { opacity: 1; animation: none; transform: none; }
    .radar-ring, .pulse, .blink, .glow-line, .telemetry-sweep { animation: none; opacity: 1; }
  }
</style>

<!-- Gradients -->
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#120e17"/>
  <stop offset="100%" stop-color="#09070d"/>
</linearGradient>

<linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
</linearGradient>

<linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#ff2e88" stop-opacity="0.0"/>
</linearGradient>

<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="65%" stop-color="#f1f5f9"/>
  <stop offset="100%" stop-color="#ff9ec7"/>
</linearGradient>

<linearGradient id="accentGlowGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff2e88"/>
  <stop offset="100%" stop-color="#ff007f"/>
</linearGradient>

<pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
</pattern>

<radialGradient id="ambientGlow" cx="0.1" cy="0.1" r="0.7">
  <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#ff2e88" stop-opacity="0"/>
</radialGradient>

<filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
  <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
</filter>

<filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff2e88" flood-opacity="0.55"/>
</filter>
</defs>

<!-- Main Canvas Background -->
<rect x="0" y="0" width="900" height="500" rx="20" fill="#07050a"/>
<rect x="0" y="0" width="900" height="500" rx="20" fill="url(#dotGrid)"/>
<rect x="0" y="0" width="900" height="500" rx="20" fill="url(#ambientGlow)"/>
<rect x="0.5" y="0.5" width="899" height="499" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

<!-- Corner Precision Ticks -->
<path d="M 12 4 L 4 4 L 4 12 M 888 4 L 896 4 L 896 12 M 4 488 L 4 496 L 12 496 M 896 488 L 896 496 L 888 496" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-opacity="0.4"/>

<!-- ═══════════════════════════════════════════════════════════════
     CARD 1: IDENTITY & HERO (Left Top: 550 x 224)
     ═══════════════════════════════════════════════════════════════ -->
<g class="rise d1">
  <rect class="card-bg" x="20" y="20" width="550" height="224" rx="16" filter="url(#shadowDepth)"/>
  <rect class="edge" x="20.5" y="20.5" width="549" height="223" rx="15.5"/>
  <rect x="21" y="21" width="548" height="34" rx="15" fill="url(#headerGrad)"/>
  
  <!-- Header Bar -->
  <text class="mono faint" x="38" y="42" font-size="10" font-weight="600" letter-spacing="1"><tspan class="accent">//</tspan> SYSTEM.IDENTITY <tspan fill="#334155">[PID: 0x4B42]</tspan></text>
  <circle cx="548" cy="38" r="3" fill="#ff2e88" opacity="0.6"/>
  <circle cx="536" cy="38" r="3" fill="#64748b" opacity="0.4"/>

  <!-- Radar Avatar / Core Glyph -->
  <g transform="translate(0, 0)">
    <circle cx="75" cy="115" r="34" fill="#0d0a13" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="75" cy="115" r="28" fill="none" stroke="url(#accentGlowGrad)" stroke-width="1" stroke-dasharray="8 4" class="radar-ring" opacity="0.8"/>
    <circle cx="75" cy="115" r="22" fill="#150f1c" stroke="#ff2e88" stroke-opacity="0.3" stroke-width="1"/>
    <text class="mono accent" x="75" y="121" font-size="18" font-weight="700" text-anchor="middle" filter="url(#accentGlow)">❯_</text>
  </g>

  <!-- Title & Credentials -->
  <text class="sans" x="126" y="105" font-size="30" font-weight="800" letter-spacing="-0.5" fill="url(#nameGrad)">KeelBismarck</text>
  <text class="sans text" x="126" y="127" font-size="12" font-weight="500">Systems &amp; High-Load Engineer · Full-Stack Architect</text>
  
  <!-- Status Badges -->
  <g transform="translate(126, 142)">
    <!-- Availability Pill -->
    <rect x="0" y="0" width="186" height="26" rx="13" fill="#10b981" fill-opacity="0.09" stroke="#10b981" stroke-opacity="0.32"/>
    <circle class="pulse" cx="14" cy="13" r="4" fill="#10b981"/>
    <text class="sans" x="26" y="17" font-size="11" font-weight="600" fill="#6ee7b7">OPEN FOR FREELANCE</text>

    <!-- Location Pill -->
    <rect x="194" y="0" width="132" height="26" rx="13" class="chip"/>
    <text class="mono muted" x="206" y="17" font-size="10">MOSCOW · UTC+3</text>
  </g>

  <!-- Motto / Principle -->
  <line x1="38" y1="188" x2="550" y2="188" stroke="#ffffff" stroke-opacity="0.05"/>
  <text class="mono faint" x="38" y="210" font-size="10">PHILOSOPHY : <tspan class="text">"Deterministic logic. Low latency. Zero compromise."</tspan></text>
</g>

<!-- ═══════════════════════════════════════════════════════════════
     CARD 2: TELEMETRY & RUNTIME (Right Top: 290 x 224)
     ═══════════════════════════════════════════════════════════════ -->
<g class="rise d2">
  <rect class="card-bg" x="590" y="20" width="290" height="224" rx="16" filter="url(#shadowDepth)"/>
  <rect class="edge" x="590.5" y="20.5" width="289" height="223" rx="15.5"/>
  <rect x="591" y="21" width="288" height="34" rx="15" fill="url(#headerGrad)"/>
  
  <text class="mono faint" x="608" y="42" font-size="10" font-weight="600" letter-spacing="1"><tspan class="accent">//</tspan> ENGINE.TELEMETRY</text>
  <rect class="blink" x="856" y="34" width="8" height="8" rx="2" fill="#ff2e88"/>

  <!-- Telemetry Metrics -->
  <g class="mono" font-size="10" transform="translate(608, 72)">
    <!-- Row 1 -->
    <text class="faint" x="0" y="10">DOMAIN</text>
    <text class="text" x="254" y="10" text-anchor="end">Distributed / Low-Load</text>
    <line x1="0" y1="20" x2="254" y2="20" stroke="#ffffff" stroke-opacity="0.04"/>

    <!-- Row 2 -->
    <text class="faint" x="0" y="38">PARADIGM</text>
    <text class="white" x="254" y="38" text-anchor="end" font-weight="600">Type-Safe &amp; Async</text>
    <line x1="0" y1="48" x2="254" y2="48" stroke="#ffffff" stroke-opacity="0.04"/>

    <!-- Row 3 -->
    <text class="faint" x="0" y="66">RESPONSE SLA</text>
    <text class="accent" x="254" y="66" text-anchor="end" font-weight="700">&lt; 24h Guaranteed</text>
    <line x1="0" y1="76" x2="254" y2="76" stroke="#ffffff" stroke-opacity="0.04"/>

    <!-- Row 4 -->
    <text class="faint" x="0" y="94">TESTING</text>
    <text class="text" x="254" y="94" text-anchor="end">CI/CD Automated</text>
    <line x1="0" y1="104" x2="254" y2="104" stroke="#ffffff" stroke-opacity="0.04"/>

    <!-- Active Pulse Waveform -->
    <g transform="translate(0, 118)">
      <path d="M 0 16 L 40 16 L 60 4 L 75 28 L 90 8 L 105 22 L 120 16 L 254 16" fill="none" stroke="#ff2e88" stroke-width="1.5" class="glow-line" filter="url(#accentGlow)"/>
      <text class="faint" x="0" y="34" font-size="9">SIGNAL: LOCK // SYNCHRONIZED</text>
      <circle cx="250" cy="16" r="3" fill="#ff2e88" class="pulse"/>
    </g>
  </g>
</g>

<!-- ═══════════════════════════════════════════════════════════════
     CARD 3: ARCHITECTURAL MATRIX (Left Bottom: 550 x 216)
     ═══════════════════════════════════════════════════════════════ -->
<g class="rise d3">
  <rect class="card-bg" x="20" y="260" width="550" height="220" rx="16" filter="url(#shadowDepth)"/>
  <rect class="edge" x="20.5" y="260.5" width="549" height="219" rx="15.5"/>
  <rect x="21" y="261" width="548" height="34" rx="15" fill="url(#headerGrad)"/>
  
  <text class="mono faint" x="38" y="282" font-size="10" font-weight="600" letter-spacing="1"><tspan class="accent">//</tspan> TECHNICAL.MATRIX <tspan fill="#334155">[SPECIALIZATIONS]</tspan></text>

  <!-- Matrix Grid -->
  <!-- Layer 1: Systems & Core -->
  <g class="sans fadeup r1" transform="translate(38, 304)">
    <text class="mono tag-label" x="0" y="16">SYSTEMS</text>
    <g transform="translate(74, 0)">
      <rect class="chip-core" x="0" y="0" width="64" height="24" rx="12"/><text class="chip-core-t" x="12" y="16" font-size="11">Rust</text>
      <rect class="chip-core" x="70" y="0" width="54" height="24" rx="12"/><text class="chip-core-t" x="12" y="16" font-size="11">C++</text>
      <rect class="chip" x="130" y="0" width="54" height="24" rx="12"/><text class="text" x="14" y="16" font-size="11">Java</text>
      <rect class="chip" x="190" y="0" width="54" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Bash</text>
      <rect class="chip" x="250" y="0" width="76" height="24" rx="12"/><text class="muted" x="12" y="16" font-size="11">Linux CLI</text>
    </g>
  </g>

  <!-- Layer 2: Backend & Distributed -->
  <g class="sans fadeup r2" transform="translate(38, 336)">
    <text class="mono tag-label" x="0" y="16">BACKEND</text>
    <g transform="translate(74, 0)">
      <rect class="chip-core" x="0" y="0" width="72" height="24" rx="12"/><text class="chip-core-t" x="12" y="16" font-size="11">Python</text>
      <rect class="chip" x="78" y="0" width="68" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">FastAPI</text>
      <rect class="chip" x="152" y="0" width="70" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Node.js</text>
      <rect class="chip" x="228" y="0" width="84" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">TypeScript</text>
      <rect class="chip" x="318" y="0" width="52" height="24" rx="12"/><text class="muted" x="12" y="16" font-size="11">Flask</text>
    </g>
  </g>

  <!-- Layer 3: Data & Storage -->
  <g class="sans fadeup r3" transform="translate(38, 368)">
    <text class="mono tag-label" x="0" y="16">STORAGE</text>
    <g transform="translate(74, 0)">
      <rect class="chip" x="0" y="0" width="88" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">PostgreSQL</text>
      <rect class="chip" x="94" y="0" width="56" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Redis</text>
      <rect class="chip" x="156" y="0" width="58" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">MySQL</text>
      <rect class="chip" x="220" y="0" width="58" height="24" rx="12"/><text class="muted" x="12" y="16" font-size="11">SQLite</text>
    </g>
  </g>

  <!-- Layer 4: Infrastructure & Delivery -->
  <g class="sans fadeup r4" transform="translate(38, 400)">
    <text class="mono tag-label" x="0" y="16">INFRA</text>
    <g transform="translate(74, 0)">
      <rect class="chip" x="0" y="0" width="64" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Docker</text>
      <rect class="chip" x="70" y="0" width="58" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Nginx</text>
      <rect class="chip" x="134" y="0" width="46" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">Git</text>
      <rect class="chip" x="186" y="0" width="94" height="24" rx="12"/><text class="text" x="12" y="16" font-size="11">GitHub Actions</text>
      <rect class="chip" x="286" y="0" width="70" height="24" rx="12"/><text class="muted" x="12" y="16" font-size="11">Electron</text>
    </g>
  </g>
  
  <text class="mono faint" x="38" y="458" font-size="9">HIGH CONCURRENCY · EVENT-DRIVEN ARCHITECTURE · REVERSE ENGINEERING</text>
</g>

<!-- ═══════════════════════════════════════════════════════════════
     CARD 4: DIRECT TRANSCEIVER / COMMS (Right Bottom: 290 x 220)
     ═══════════════════════════════════════════════════════════════ -->
<g class="rise d4">
  <rect class="card-bg" x="590" y="260" width="290" height="220" rx="16" filter="url(#shadowDepth)"/>
  <rect class="edge" x="590.5" y="260.5" width="289" height="219" rx="15.5"/>
  <rect x="591" y="261" width="288" height="34" rx="15" fill="url(#headerGrad)"/>
  
  <text class="mono faint" x="608" y="282" font-size="10" font-weight="600" letter-spacing="1"><tspan class="accent">//</tspan> DIRECT.TRANSCEIVER</text>
  <circle cx="858" cy="278" r="3" fill="#10b981" class="pulse"/>

  <!-- Communication Channels with Precision Icons -->
  <g class="sans" font-size="11" transform="translate(608, 304)">
    <!-- Telegram -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" fill-opacity="0.04"/>
      <!-- Telegram Icon -->
      <path d="M 7 12 L 17 8 L 15 17 L 11 14 Z M 11 14 L 14 11" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="text" x="32" y="16" font-weight="600">@bismark_dev</text>
      <text class="mono faint" x="254" y="16" text-anchor="end" font-size="9">TG</text>
      <line x1="0" y1="28" x2="254" y2="28" stroke="#ffffff" stroke-opacity="0.04"/>
    </g>

    <!-- Discord -->
    <g transform="translate(0, 36)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" fill-opacity="0.04"/>
      <!-- Gamepad / Discord icon -->
      <path d="M 6 10 C 8 8 16 8 18 10 C 18 14 17 17 15 17 C 14 16 13 14 11 14 C 9 14 8 16 7 17 C 5 17 4 14 6 10 Z" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="9.5" cy="12" r="0.8" fill="#ff2e88"/>
      <circle cx="14.5" cy="12" r="0.8" fill="#ff2e88"/>
      <text class="text" x="32" y="16" font-weight="600">justkeel.6707</text>
      <text class="mono faint" x="254" y="16" text-anchor="end" font-size="9">DISCORD</text>
      <line x1="0" y1="28" x2="254" y2="28" stroke="#ffffff" stroke-opacity="0.04"/>
    </g>

    <!-- Email -->
    <g transform="translate(0, 72)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" fill-opacity="0.04"/>
      <!-- Mail icon -->
      <rect x="6.5" y="7.5" width="11" height="8" rx="1.5" fill="none" stroke="#ff2e88" stroke-width="1.2"/>
      <path d="M 7 8.5 L 12 12 L 17 8.5" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-linejoin="round"/>
      <text class="text" x="32" y="16" font-size="10.5">contact@keelbismark.space</text>
      <text class="mono faint" x="254" y="16" text-anchor="end" font-size="9">MAIL</text>
      <line x1="0" y1="28" x2="254" y2="28" stroke="#ffffff" stroke-opacity="0.04"/>
    </g>

    <!-- GitHub / Code -->
    <g transform="translate(0, 108)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" fill-opacity="0.04"/>
      <!-- Code brackets icon -->
      <path d="M 9.5 9 L 6.5 12 L 9.5 15 M 14.5 9 L 17.5 12 L 14.5 15" fill="none" stroke="#ff2e88" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="text" x="32" y="16" font-weight="600">keelbismark</text>
      <text class="mono faint" x="254" y="16" text-anchor="end" font-size="9">GITHUB</text>
    </g>
  </g>

  <!-- Live Status Footer -->
  <g transform="translate(608, 412)">
    <circle cx="4" cy="5" r="3" fill="#10b981" class="pulse"/>
    <text class="mono faint" x="14" y="8" font-size="9">CHANNELS MONITORED // ENCRYPTED</text>
  </g>
</g>
</svg>