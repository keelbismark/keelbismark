<svg width="900" height="494" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  .label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #5b6470; letter-spacing: 2px; }
  .accent { fill: #ff3e00; }
  .white { fill: #f0f6fc; }
  .text { fill: #c9d1d9; }
  .muted { fill: #8b949e; }
  .green { fill: #3fb950; }
  .card-bg { fill: url(#cardGrad); stroke: #ffffff; stroke-opacity: 0.08; }
  .chip { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.10; }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; }
  .d4 { animation-delay: .35s; } .d5 { animation-delay: .45s; }
  .fade { opacity: 0; animation: fade .4s ease-out forwards; }
  .f1 { animation-delay: 1.4s; } .f2 { animation-delay: 2.7s; } .f3 { animation-delay: 3s; }
  .t1 { width: 0; animation: t1 .6s steps(10) .8s forwards; }
  .t2 { width: 0; animation: t2 .8s steps(16) 1.9s forwards; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes t1 { to { width: 50px; } }
  @keyframes t2 { to { width: 110px; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
</style>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0b0e13"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b6c2d0"/>
</linearGradient>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff3e00"/><stop offset="1" stop-color="#ff8a50"/>
</linearGradient>
<radialGradient id="glowBG" cx="0.2" cy="0" r="0.9">
  <stop offset="0" stop-color="#ff3e00" stop-opacity="0.07"/><stop offset="1" stop-color="#ff3e00" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
</pattern>
<filter id="glowO" x="-80%" y="-80%" width="260%" height="260%">
  <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff3e00" flood-opacity="0.45"/>
</filter>
<filter id="glowG" x="-80%" y="-80%" width="260%" height="260%">
  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3fb950" flood-opacity="0.6"/>
</filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
</filter>
<clipPath id="tc1"><rect class="t1" x="592" y="65" width="0" height="18"/></clipPath>
<clipPath id="tc2"><rect class="t2" x="592" y="119" width="0" height="18"/></clipPath>
</defs>

<!-- panel -->
<rect x="0" y="0" width="900" height="494" rx="24" fill="#05060a"/>
<rect x="0" y="0" width="900" height="494" rx="24" fill="url(#grid)"/>
<rect x="0" y="0" width="900" height="494" rx="24" fill="url(#glowBG)"/>
<rect x="0.5" y="0.5" width="899" height="493" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

<!-- ═══ IDENTITY ═══ -->
<g class="rise d1">
  <rect class="card-bg" x="20" y="20" width="520" height="210" rx="20" filter="url(#shadow)"/>
  <text class="label" x="516" y="50" text-anchor="end"><tspan class="accent">//</tspan> identity</text>
  <circle cx="76" cy="96" r="32" fill="#0b0e13" stroke="url(#ringGrad)" stroke-width="2"/>
  <text class="mono white" x="76" y="104" font-size="20" font-weight="700" text-anchor="middle">KB</text>
  <text class="sans" x="128" y="88" font-size="34" font-weight="700" fill="url(#nameGrad)">KeelBismarck</text>
  <rect class="accent" x="128" y="100" width="56" height="3" rx="1.5" filter="url(#glowO)"/>
  <text class="sans muted" x="128" y="126" font-size="13">Full-stack Developer · Python / JavaScript / C++</text>
  <rect x="128" y="148" width="168" height="28" rx="14" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.35"/>
  <circle class="green pulse" cx="146" cy="162" r="4" filter="url(#glowG)"/>
  <text class="sans" x="158" y="167" font-size="12" fill="#7ee2a8">Open for freelance</text>
  <rect x="308" y="148" width="148" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <text class="sans muted" x="324" y="167" font-size="12">Moscow · UTC+3</text>
</g>

<!-- ═══ TERMINAL ═══ -->
<g class="rise d2">
  <rect class="card-bg" x="554" y="20" width="326" height="210" rx="20" filter="url(#shadow)"/>
  <path d="M554 40 a20 20 0 0 1 20 -20 h286 a20 20 0 0 1 20 20 v10 h-326 z" fill="#161b22"/>
  <circle fill="#ff5f56" cx="574" cy="35" r="5"/>
  <circle fill="#ffbd2e" cx="594" cy="35" r="5"/>
  <circle fill="#27c93f" cx="614" cy="35" r="5"/>
  <text class="mono muted" x="717" y="39" font-size="10" text-anchor="middle">keelbismark: ~</text>
  <g class="mono" font-size="12">
    <text class="accent" x="574" y="78">❯</text>
    <text class="white" x="592" y="78" clip-path="url(#tc1)">whoami</text>
    <text class="sans white fade f1" x="592" y="102" font-size="13" font-weight="700">KeelBismarck</text>
    <text class="accent fade f1" x="574" y="132">❯</text>
    <text class="white" x="592" y="132" clip-path="url(#tc2)">cat status.txt</text>
    <text class="fade f2" x="592" y="156" fill="#7ee2a8">● open for freelance</text>
    <g class="fade f3">
      <text class="accent" x="574" y="186">❯</text>
      <rect class="accent blink" x="592" y="175" width="7" height="14"/>
    </g>
  </g>
</g>

<!-- ═══ STACK ══ -->
<g class="rise d3">
  <rect class="card-bg" x="20" y="244" width="326" height="230" rx="20" filter="url(#shadow)"/>
  <text class="label" x="44" y="278"><tspan class="accent">//</tspan> stack</text>
  <g class="sans" font-size="11">
    <rect class="chip" x="44" y="296" width="62" height="24" rx="12"/><text class="text" x="56" y="312">Python</text>
    <rect class="chip" x="114" y="296" width="78" height="24" rx="12"/><text class="text" x="126" y="312">JavaScript</text>
    <rect class="chip" x="200" y="296" width="48" height="24" rx="12"/><text class="text" x="212" y="312">C++</text>
    <rect class="chip" x="44" y="328" width="76" height="24" rx="12"/><text class="text" x="56" y="344">TypeScript</text>
    <rect class="chip" x="128" y="328" width="50" height="24" rx="12"/><text class="text" x="140" y="344">Java</text>
    <rect class="chip" x="186" y="328" width="62" height="24" rx="12"/><text class="text" x="198" y="344">Node.js</text>
    <rect class="chip" x="44" y="360" width="50" height="24" rx="12"/><text class="text" x="56" y="376">Flask</text>
    <rect class="chip" x="102" y="360" width="86" height="24" rx="12"/><text class="text" x="114" y="376">Spring Boot</text>
    <rect class="chip" x="196" y="360" width="58" height="24" rx="12"/><text class="text" x="208" y="376">Docker</text>
    <rect class="chip" x="44" y="392" width="82" height="24" rx="12"/><text class="text" x="56" y="408">PostgreSQL</text>
    <rect class="chip" x="134" y="392" width="40" height="24" rx="12"/><text class="text" x="146" y="408">Git</text>
    <rect class="chip" x="182" y="392" width="52" height="24" rx="12"/><text class="text" x="194" y="408">Linux</text>
  </g>
</g>

<!-- ═══ FOCUS ═══ -->
<g class="rise d4">
  <rect class="card-bg" x="360" y="244" width="180" height="230" rx="20" filter="url(#shadow)"/>
  <text class="label" x="384" y="278"><tspan class="accent">//</tspan> focus</text>
  <g class="sans" font-size="12">
    <rect class="accent" x="384" y="298" width="6" height="6" rx="1.5"/><text class="text" x="398" y="306">Backend APIs</text>
    <rect class="accent" x="384" y="332" width="6" height="6" rx="1.5"/><text class="text" x="398" y="340">System tools</text>
    <rect class="accent" x="384" y="366" width="6" height="6" rx="1.5"/><text class="text" x="398" y="374">Automation</text>
    <rect class="accent" x="384" y="400" width="6" height="6" rx="1.5"/><text class="text" x="398" y="408">Desktop apps</text>
  </g>
</g>

<!-- ═══ CONTACT ═══ -->
<g class="rise d5">
  <rect class="card-bg" x="554" y="244" width="326" height="230" rx="20" filter="url(#shadow)"/>
  <text class="label" x="578" y="278"><tspan class="accent">//</tspan> contact</text>
  <g class="mono" font-size="9">
    <circle cx="590" cy="302" r="10" fill="#ffffff" fill-opacity="0.06"/><text class="accent" x="590" y="305" text-anchor="middle">D</text>
    <circle cx="590" cy="338" r="10" fill="#ffffff" fill-opacity="0.06"/><text class="accent" x="590" y="341" text-anchor="middle">@</text>
    <circle cx="590" cy="374" r="10" fill="#ffffff" fill-opacity="0.06"/><text class="accent" x="590" y="377" text-anchor="middle">GH</text>
  </g>
  <g class="sans" font-size="12">
    <text class="text" x="610" y="306">justkeel.6707</text><text class="muted" x="856" y="306" text-anchor="end" font-size="10">discord</text>
    <text class="text" x="610" y="342">contact@keelbismark.space</text><text class="muted" x="856" y="342" text-anchor="end" font-size="10">email</text>
    <text class="text" x="610" y="378">github.com/keelbismark</text><text class="muted" x="856" y="378" text-anchor="end" font-size="10">github</text>
  </g>
  <line x1="578" y1="402" x2="856" y2="402" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle class="green pulse" cx="584" cy="422" r="3"/>
  <text class="sans muted" x="596" y="426" font-size="11">response time &lt; 24h</text>
</g>
</svg>