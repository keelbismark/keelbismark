<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">KeelBismarck — Full-stack &amp; Systems Engineer</title>
  <desc id="desc">Engineering logic. Building stability. Author of Q.E.D.</desc>
  <defs>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Protective self-contained canvas -->
  <rect x="2" y="2" width="956" height="146" rx="14" fill="url(#canvas)" stroke="#334155"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Category Label -->
    <text x="32" y="34" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">ENGINEERING / FULL-STACK &amp; SYSTEMS</text>

    <!-- Main Identity Headline -->
    <text x="30" y="98" fill="#f8fafc" font-size="52" font-weight="750" letter-spacing="-1.5">KeelBismarck</text>

    <!-- Subtitle Meta -->
    <text x="32" y="126" fill="#64748b" font-size="11" letter-spacing="1">AUTHOR OF Q.E.D. · MOSCOW [UTC+3]</text>

    <!-- Clean Vertical Divider -->
    <path d="M410 44v62" stroke="#334155" stroke-width="1"/>

    <!-- Mission / Positioning -->
    <text x="436" y="70" fill="#f8fafc" font-size="21" font-weight="600">Engineering logic. Building stability.</text>
    <text x="436" y="96" fill="#94a3b8" font-size="14">High-assurance software, systems architecture, and deterministic code.</text>

    <!-- Right Side Status Badge -->
    <rect x="804" y="44" width="124" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="822" cy="63" r="4" fill="#10b981"/>
    <text x="832" y="67" fill="#f8fafc" font-size="11" font-weight="600">Available</text>
    <text x="814" y="88" fill="#94a3b8" font-size="9.5" letter-spacing="0.5">OPEN FOR WORK</text>
  </g>
</svg>
